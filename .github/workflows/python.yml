name: Python package

on:
  push:
    branches: [ develop, release* ]
    tags:
      - '*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for release'
        required: true

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.10"]
        node-version: [16.x]

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Django==3.1 python-gnupg
          cd autograder-server && python3 generate_secrets.py
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build autograder-server
        run: |
          docker compose build
          docker compose up -d
          docker ps -a
      - name: Install npm packages
        run: npm ci
      - name: Apply migrations
        run: docker exec -i typescript-cli-django python3 manage.py migrate
      - name: Lint and test
        run: |
          npm run lint && npm test
