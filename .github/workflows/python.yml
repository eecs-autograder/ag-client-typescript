name: Python package

on:
  push:
    branches: [ develop, release* ]
    tags:
      - '*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for release'
        required: true

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.10"]
        node-version: [16.x]

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      # Yes, we're running this on each step because I couldn't figure out
      # the quirks of uploading/downloading artifacts into the right
      # directory
      - name: Update version number (on dispatch only)
        run: ./dev_scripts/ci/update_version_number.sh "${{ inputs.version }}"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Django==3.1 python-gnupg
          cd autograder-server && python3 generate_secrets.py
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build autograder-server
        run: |
          docker compose build
          docker compose up -d
          docker ps -a
      - name: Install npm packages
        run: npm ci
      - name: Apply migrations
        run: docker exec -i typescript-cli-django python3 manage.py migrate
      - name: Lint and test
        run: |
          npm run lint && npm test

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'

    # needs:
    # - test

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases

    steps:
      - uses: actions/checkout@v3

      # Yes, we're running this on each step because I couldn't figure out
      # the quirks of uploading/downloading artifacts into the right
      # directory
      - name: Update version number (on dispatch only)
        run: ./dev_scripts/ci/update_version_number.sh "${{ inputs.version }}"

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit updated version files
        run: |
          git add package.json package-lock.json
          git commit -m "Version ${{ inputs.version }}"
          git push --dry-run
          git tag ${{ inputs.version }}
          git push --tags --dry-run

      # - name: Create GitHub Release
      #   env:
      #     GITHUB_TOKEN: ${{ github.token }}
      #   run: >-
      #     gh release create
      #     "${{ inputs.version }}"
      #     --repo "$GITHUB_REPOSITORY"
      #     --notes ""
