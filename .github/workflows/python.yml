name: Python package

on:
  push:
    branches: [ develop, release* ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for release'
        required: true

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.10"]
        node-version: [16.x]

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      # Yes, we're running this on each step because I couldn't figure out
      # the quirks of uploading/downloading artifacts into the right
      # directory
      - name: Update version number (on dispatch only)
        run: ./dev_scripts/ci/update_version_number.sh "${{ inputs.version }}"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Django==3.1 python-gnupg
          cd autograder-server && python3 generate_secrets.py
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build autograder-server
        run: |
          docker compose build
          docker compose up -d
          docker ps -a
      - name: Install npm packages
        run: npm ci
      - name: Apply migrations
        run: docker exec -i typescript-cli-django python3 manage.py migrate
      - name: Lint and test
        run: |
          npm run lint && npm test

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'

    needs:
    - test

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases

    steps:
      # See https://github.com/organizations/eecs-autograder/settings/apps
      # and https://github.com/orgs/community/discussions/25305#discussioncomment-8256560
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      # Yes, we're running this on each step because I couldn't figure out
      # the quirks of uploading/downloading artifacts into the right
      # directory
      - name: Update version number (on dispatch only)
        run: ./dev_scripts/ci/update_version_number.sh "${{ inputs.version }}"
      - name: Commit updated version files
        run: |
          git add package.json package-lock.json
          git commit -m "Version ${{ inputs.version }}"
          git push
          git tag ${{ inputs.version }}
          git push --tags

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          "${{ inputs.version }}"
          --repo "$GITHUB_REPOSITORY"
          --notes ""
